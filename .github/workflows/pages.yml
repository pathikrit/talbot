name: Test and deploy Talbot

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            vendor
          key: ${{ runner.os }}-${{ runner.arch }}-emscripten-6.0.9-patricia-f1ee427
      - run: make bootstrap
      - run: make test
      - run: npm run book:check
      - run: make gh-page
      - name: Disable unused Chrome apt repository
        # Playwright downloads its own browsers. A stale Google apt mirror must
        # not block installation of browser libraries from Ubuntu repositories.
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
